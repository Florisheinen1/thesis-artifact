[package]
name = "rewriter"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo_metadata = "0.23.1"
csv = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.117", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
walkdir = "2.5.0"

hir = { path = "rust-analyzer/crates/hir" }
ide = { path = "rust-analyzer/crates/ide" }
base-db = { path = "rust-analyzer/crates/base-db" }
ide-db = { path = "rust-analyzer/crates/ide-db" }
hir-ty = { path = "rust-analyzer/crates/hir-ty" }
# tls-db = { path = "rust-analyzer/crates/tls-db" }
load-cargo = { path = "rust-analyzer/crates/load-cargo" }
project-model = { path = "rust-analyzer/crates/project-model" }
paths = { path = "rust-analyzer/crates/paths" }
vfs = { path = "rust-analyzer/crates/vfs" }
syntax = { path = "rust-analyzer/crates/syntax" }
anyhow = "1.0.102"
either = "1.15.0"
clap = { version = "4", features = ["derive"] }
